name: Production health monitor

on:
  workflow_dispatch:
  schedule:
    # Every hour, away from the busy start of the hour (UTC).
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: production-health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      PRODUCTION_FRONTEND_URL: ${{ vars.PRODUCTION_FRONTEND_URL }}
      PRODUCTION_BACKEND_URL: ${{ vars.PRODUCTION_BACKEND_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Check frontend, backend and database
        run: node .github/scripts/check-production-health.ts
